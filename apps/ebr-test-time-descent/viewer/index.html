<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EBR test-time descent</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121a23;
      --line: #243140;
      --text: #e6edf3;
      --muted: #93a1b0;
      --accent: #7ee0b0;
      --bad: #ff8a8a;
      --given: #e6edf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(1080px, 94vw); margin: 32px auto 64px; }
    h1 { font-size: 1.8rem; letter-spacing: -0.03em; margin: 0 0 8px; }
    p { color: var(--muted); }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 28px; align-items: start; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
    canvas { width: 100%; background: #070b10; border: 1px solid var(--line); border-radius: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
    .PASS { background: #143d2c; color: var(--accent); }
    .PARTIAL { background: #3d3314; color: #f2c46d; }
    .FAIL { background: #3d1414; color: var(--bad); }
    button {
      background: transparent; color: var(--text); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600;
    }
    img { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
    code { font-family: ui-monospace, monospace; font-size: 0.88em; }
  </style>
</head>
<body>
  <main>
    <h1>Energy-Based Reasoner, test-time descent</h1>
    <p id="lead">Loading the pre-registered Sudoku-Extreme subset…</p>
    <div class="layout">
      <div>
        <canvas id="board" width="640" height="640" aria-label="Sudoku board across descent segments"></canvas>
        <p>
          <button id="play" type="button">Pause</button>
          <span id="step">Segment —</span>
        </p>
      </div>
      <div class="card">
        <p><span id="status" class="badge">…</span></p>
        <p id="facts"></p>
        <img src="../experiments/exp1_cpu_sudoku_extreme/plot.png" alt="Accuracy, energy, and breakpoints">
      </div>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    let summary = null;
    let frame = 0;
    let timer = null;

    function digit(token, blank) {
      return token <= blank ? "" : String(token - 1);
    }

    function draw() {
      const ex = summary.example;
      const blank = summary.blank_token;
      const seg = Math.min(frame, ex.preds.length - 1);
      const pred = ex.preds[seg];
      const n = 9;
      const s = canvas.width / n;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#070b10";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const k = r * n + c;
          const given = digit(ex.clues[k], blank);
          const shown = given || digit(pred[k], blank);
          const solution = digit(ex.labels[k], blank);
          ctx.fillStyle = (r % 2 === c % 2) ? "#0d141c" : "#101820";
          ctx.fillRect(c * s, r * s, s, s);
          if (!shown) continue;
          const ok = shown === solution;
          ctx.fillStyle = given ? "#e6edf3" : (ok ? "#7ee0b0" : "#ff8a8a");
          ctx.font = `700 ${Math.floor(s * 0.46)}px ui-sans-serif, system-ui, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(shown, (c + 0.5) * s, (r + 0.5) * s + 1);
        }
      }
      ctx.strokeStyle = "#8aa0b4";
      ctx.lineWidth = 3;
      for (let i = 0; i <= n; i += 3) {
        ctx.beginPath();
        ctx.moveTo(i * s, 0);
        ctx.lineTo(i * s, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * s);
        ctx.lineTo(canvas.width, i * s);
        ctx.stroke();
      }
      const solved = ex.exact[seg] ? "solved" : "unsolved";
      document.getElementById("step").textContent =
        `Segment ${seg + 1} of ${ex.preds.length} · rating ${ex.rating} · ${solved}`;
    }

    function tick() {
      frame = (frame + 1) % summary.example.preds.length;
      draw();
    }

    document.getElementById("play").addEventListener("click", () => {
      const button = document.getElementById("play");
      if (timer) {
        clearInterval(timer);
        timer = null;
        button.textContent = "Play";
      } else {
        timer = setInterval(tick, 700);
        button.textContent = "Pause";
      }
    });

    fetch("summary.json")
      .then((res) => res.json())
      .then((data) => {
        summary = data;
        const status = document.getElementById("status");
        status.textContent = data.status;
        status.className = "badge " + data.status;
        const gain = (100 * data.gain_16_minus_4).toFixed(1);
        const acc4 = (100 * data.exact_mean[3]).toFixed(1);
        const acc16 = (100 * data.exact_mean[15]).toFixed(1);
        const auroc = Number(data.energy_auroc_mean).toFixed(3);
        document.getElementById("lead").textContent =
          "Official 1.8M Sudoku-Extreme checkpoint. 96 highest-rated test boards, seeds 0/1/2, CPU.";
        document.getElementById("facts").innerHTML =
          `Exact accuracy ${acc4}% at the training halt (segment 4) and ${acc16}% at segment 16 ` +
          `(gain ${gain} points; bar +2). Energy AUROC ${auroc} (bar 0.70). ` +
          `Ratings ${data.ratings.min}–${data.ratings.max}. ` +
          `Given clues are white; descent fills green when right and red when wrong.`;
        draw();
        timer = setInterval(tick, 700);
      })
      .catch(() => {
        document.getElementById("lead").textContent =
          "summary.json is missing. Run ./run_all.sh, then open this page from a local server.";
      });
  </script>
</body>
</html>
