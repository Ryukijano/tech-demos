# Fixed on 2026-10-11 BEFORE the experiment ran. Do not edit thresholds after seeing results.
exp_id: exp1_cpu_stability
hypothesis: >
  On a CPU-only machine (no GPU), the released Qure.ai TorchScript models decompose a 1024x1024
  frontal chest radiograph into bone / soft tissue / lung component fast enough to be practical,
  and the bone output is stable under small input noise: SSIM(bone_clean, bone_noisy) stays high
  when seeded Gaussian noise (sigma = 0.01 on the [0,1] scale) is added.
upstream:
  model_repo: qureaiorg/bone-suppression        # HF, CC BY-NC-SA 4.0 weights, Apache-2.0 code
  weights: [weights/bone_suppression.ts, weights/lung_component_suppression.ts]
  paper: arXiv:2609.24937
pipeline:   # identical to upstream suppress.py / HF Space hugging-apps/bone-suppression-chest-xray
  resize: [1024, 1024]
  interpolation: INTER_AREA
  normalize: per-image min-max to [0,1]
  bone: bone_model(full)
  soft: full - bone
  lung: lung_model(soft)          # float residual, NOT re-normalised
  nonlung_soft: soft - lung
inputs:     # downloaded at run time, never committed
  - {id: JPCLN030, src: "hf:qureaiorg/bone-suppression/examples/JPCLN030.png", kind: real JSRT (nodule)}
  - {id: JPCNN001, src: "hf:qureaiorg/bone-suppression/examples/JPCNN001.png", kind: real JSRT (no nodule)}
  - {id: cxr_train_1_a_1, src: "hf-space:hugging-apps/bone-suppression-chest-xray/examples/cxr_train_1_a_1.png", kind: synthetic CT projection}
  - {id: cxr_train_8_a_2, src: "hf-space:hugging-apps/bone-suppression-chest-xray/examples/cxr_train_8_a_2.png", kind: synthetic CT projection}
perturbation:
  type: gaussian_noise
  sigma: 0.01                     # added to the normalised 1024px image, then min-max re-normalised (model contract)
  rng: numpy.random.default_rng(seed * 1000 + image_index)
seeds: [0, 1, 2]
runtime:
  device: cpu
  dtype: float32
  torch_threads: 8                # all vCPUs of the box; box is shared, so latency is a noisy upper bound
  warmup_passes_per_model: 1      # first call (TorchScript profiling) excluded from latency, reported separately
metrics:
  primary: ssim_bone              # skimage SSIM, data_range = max-min of the clean bone image, on 1024x1024 float outputs
  secondary: latency_s_pipeline   # wall-clock bone forward + lung forward per image, torch.inference_mode
  report_only: [ssim_lung, psnr_bone, max_abs_diff_bone, ref_mae_8bit]
precondition:
  # sanity check that our pipeline reproduces the authors' published outputs
  ref_mae_8bit_max: 1.0           # mean |ours_u8 - examples/outputs/*_bone.png| on both JSRT images
thresholds:
  ssim_bone_min: 0.95             # per seed: mean over the 4 images must be >= 0.95
  latency_s_pipeline_max: 15.0    # per seed: mean over the 4 images must be <= 15 s
pass_rule: >
  PASS if the precondition holds AND, for every seed in {0,1,2}, mean ssim_bone >= 0.95 AND
  mean latency_s_pipeline <= 15 s. PARTIAL if exactly one of the two criteria holds on all seeds.
  FAIL otherwise (or if the precondition fails).
disclosure: >
  Before this config was written, one smoke test ran the bone model once on JPCNN001
  (cold 12.1 s, warm 3.6 s; matched the authors' PNG). The latency budget was set knowing that
  single number; the SSIM threshold was set without any stability data.
breakpoints:
  images: [JPCNN001, cxr_train_1_a_1]
  seed: 0
  compare: ssim_bone vs the clean bone output (rotation: vs the clean bone output rotated by the same angle)
  degrade_levels: {ok: 0.95, degraded: 0.80}
  families:
    noise_sigma: [0.01, 0.03, 0.05, 0.1, 0.2, 0.4]
    lowres_px: [512, 256, 128, 64]          # downsample (INTER_AREA) then upsample to 1024 (INTER_CUBIC)
    gamma: [0.33, 0.5, 2.0, 3.0]
    contrast: [0.25, 3.0]                    # (x-0.5)*k+0.5 then clip to [0,1]
    rotation_deg: [5, 15, 30, 90]
    jpeg_quality: [30, 10, 3]
    inverted: [true]
